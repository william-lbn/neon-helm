name: Linux Helm quality
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: helm-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24.19.0', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - run: bash tools/install-helm.sh "$RUNNER_TEMP/neon-helm"
      - run: echo "$RUNNER_TEMP/neon-helm" >> "$GITHUB_PATH"
      - run: bash tools/install-actionlint.sh "$RUNNER_TEMP/neon-actionlint"
      - run: '"$RUNNER_TEMP/neon-actionlint/actionlint" -color'
      - run: npm run check
      - run: npm test
      - run: npm run helm
      - run: npm run package -- --output artifacts/packages
      - run: sha256sum artifacts/packages/*.tgz artifacts/packages/index.yaml > artifacts/packages/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with: {name: helm-packages-and-gates, path: artifacts, retention-days: 90}
  release:
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish versioned chart packages and source locks
        env: {GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}'}
        run: |
          gh run download "$GITHUB_RUN_ID" --name helm-packages-and-gates --dir artifacts
          test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.tgz artifacts/packages/index.yaml artifacts/packages/SHA256SUMS locks/*.json stack/stack.json --verify-tag --title "Neon Helm $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
