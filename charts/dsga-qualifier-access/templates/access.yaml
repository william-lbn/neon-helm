{{- include "dsga-qualifier-access.validate" . -}}
{{- $name := include "dsga-qualifier-access.fullname" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-secret
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.configSecretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-secret
  namespace: {{ .Release.Namespace | quote }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Values.subject.namespace | quote }}
    name: {{ .Values.subject.name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-node
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    resourceNames: [{{ .Values.nodeName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-node
subjects:
  - kind: ServiceAccount
    namespace: {{ .Values.subject.namespace | quote }}
    name: {{ .Values.subject.name | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-node
