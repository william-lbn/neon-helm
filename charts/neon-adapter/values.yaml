# Compiled Go runtime from the control-plane repository; no interpreter required.
# This adapter has not passed the distributed fencing / production HA gates.
compatibilityAcknowledged: false
fullnameOverride: neon-control-adapter
image: ''
proxyTokenSecret: neon-proxy-auth # key: proxyToken
hookTokenSecret: neon-control-hook-auth # key: token
routesSecret: neon-control-routes # key: routes.json; externally mutable, NEVER reset by Helm
notificationsConfigMap: neon-control-notifications # key: receipts.json; never reset
wakeTimeout: 300s # Native Proxy request bound; maximum five minutes.
maxConcurrentWakes: 8 # Per-process bound, not a distributed lease/fence.
pageserverNodeID: 2 # Current unsharded storage layout; changes require a real reconfiguration Driver.
priorityClassName: ''
resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: '1', memory: 256Mi}
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
podAnnotations: {}

# 本轮 PG17 专用节点池；部署前必须验证标签只属于这三个节点。
placement:
  allowedNodeNames:
  - worker-117
  - worker-118
  - worker-119

# managed 路由只验证原已封定实例，不读取控制签名seed或业务密码。
# 每项显式绑定同一个Compute的SQL Service和不可变配置Secret；默认不增加权限。
managedRuntimeRead:
  computes: []

# 原生TLS/JWT读通路；仅引用只读Secret，不能给Adapter控制面create_token。
storageManagement:
  enabled: false
  profile: {}
