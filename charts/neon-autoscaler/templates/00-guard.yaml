{{- if not .Values.experimentalAcknowledged -}}{{- fail "EXPERIMENTAL ONLY. See docs/PRODUCTION-GATES.md" -}}{{- end -}}
{{- range $name, $image := .Values.images -}}
{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" $image) -}}{{- fail (printf "images.%s must be pinned by digest" $name) -}}{{- end -}}
{{- end -}}
{{- $minor := trimSuffix "+" (toString .Capabilities.KubeVersion.Minor) -}}
{{- if and (not .Values.compatibility.allowUntestedKubernetes) (ne $minor (toString .Values.compatibility.expectedKubernetesMinor)) -}}{{- fail "Autoscaling Kubernetes minor differs from the configured target; validate the actual runtime before enabling business" -}}{{- end -}}
