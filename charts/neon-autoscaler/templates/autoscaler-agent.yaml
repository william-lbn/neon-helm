apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoscaler-agent
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autoscaler-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: autoscaler-agent
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: autoscaler-virtualmachine-editor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: neonvm-virtualmachine-editor-role
subjects:
- kind: ServiceAccount
  name: autoscaler-agent
  namespace: kube-system

---
apiVersion: v1
data:
  config.json: |
    {{- include "neon-autoscaler.dsga.agentConfig" . | nindent 4 }}
kind: ConfigMap
metadata:
  name: autoscaler-agent-config
  namespace: kube-system

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: autoscaler-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: autoscaler-agent
  template:
    metadata:
      labels:
        name: autoscaler-agent
      annotations:
        checksum/runtime-config: {{ include "neon-autoscaler.dsga.agentConfig" . | sha256sum }}
    spec:
      {{- include "neon-autoscaler.placement.pod" $ | nindent 6 }}
      containers:
      - env:
        - name: K8S_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CONFIG_PATH
          value: /etc/autoscaler-agent-config/config.json
        image: {{ .Values.images.agent | quote }}
        name: autoscaler-agent
        ports:
        - containerPort: 9100
          name: metrics
          protocol: TCP
        - containerPort: 9101
          name: vm-metrics
          protocol: TCP
        resources: {{ toYaml .Values.agent.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /etc/autoscaler-agent-config
          name: config
          readOnly: true
        {{- if .Values.dsga.enabled }}
        - name: dsga-management-ca
          mountPath: /etc/neon-dsga/management
          readOnly: true
        - name: dsga-broker-token
          mountPath: /var/run/secrets/neon-dsga
          readOnly: true
        {{- if .Values.dsga.agent.resourceReadSocket.enabled }}
        - name: dsga-resource-read
          mountPath: {{ .Values.dsga.agent.resourceReadSocket.mountDirectory | quote }}
        {{- end }}
        {{- end }}
      serviceAccountName: autoscaler-agent
      volumes:
      - configMap:
          name: autoscaler-agent-config
        name: config

{{- if .Values.dsga.enabled }}
      - name: dsga-management-ca
        secret:
          secretName: {{ .Values.dsga.agent.managementCASecret | quote }}
          items:
          - key: {{ .Values.dsga.agent.managementCAKey | quote }}
            path: ca.crt
      - name: dsga-broker-token
        projected:
          defaultMode: 0400
          sources:
          - serviceAccountToken:
              audience: {{ .Values.dsga.agent.tokenAudience | quote }}
              expirationSeconds: {{ .Values.dsga.agent.tokenExpirationSeconds }}
              path: token
      {{- if .Values.dsga.agent.resourceReadSocket.enabled }}
      - name: dsga-resource-read
        hostPath:
          path: {{ .Values.dsga.agent.resourceReadSocket.hostDirectory | quote }}
          type: Directory
      {{- end }}
{{- end }}
