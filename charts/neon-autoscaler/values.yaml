# Upstream policies remain unchanged; reservations are configurable.
experimentalAcknowledged: false
compatibility:
  expectedKubernetesMinor: '31'
  allowUntestedKubernetes: false
images:
  # Explicit fork locks are required; see profiles/lab/neon-autoscaler.json.
  scheduler: ''
  agent: ''
scheduler:
  resources:
    limits:
      cpu: 1
      memory: 2000Mi
    requests:
      cpu: 1
      memory: 2000Mi
agent:
  resources:
    limits:
      cpu: 1000m
      memory: 600Mi
    requests:
      cpu: 1000m
      memory: 600Mi

# 本轮 PG17 专用节点池；部署前必须验证标签只属于这三个节点。
placement:
  allowedNodeNames:
  - worker-117
  - worker-118
  - worker-119

# 只有真实原节点/Lease/预算/CA 输入齐全才启用；无推测的资格或系统预算。
dsga:
  enabled: false
  pgVersion: 17
  vmNamespace: neon
  agent:
    gatewayURL: ''
    managementCASecret: ''
    managementCAKey: ca.crt
    tokenAudience: neon-dsga-credential-broker
    tokenExpirationSeconds: 600
    requestTimeoutSeconds: 10
    computeTimeoutSeconds: 100
    pollIntervalSeconds: 5
    prepareQualifications: {}
    automaticMemory: {}
    # 独立资源读取UDS；目录须在原worker预建root:root 0700，Helm不创建或chown。
    # 仅供固定资格发布器读取，不能填完整管理socket或共享其目录。
    resourceReadSocket:
      enabled: false
      hostDirectory: ''
      mountDirectory: ''
      name: ''
  scheduler:
    nodes: []
