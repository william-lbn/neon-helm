experimentalAcknowledged: false
compute:
  startupMode: legacy # 新normal模式必须显式选trusted-runtime-v1；默认保留旧入口。
  pgVersion: 17 # 默认17不变；18必须显式trusted且使用独立确认的18镜像/Native闭包，禁止回退17镜像。
  enabled: true # false retires only the static lab VM; retain Service/config/data for explicit reactivation
  name: vm-neon-compute
  tenantId: ""
  timelineId: ""
  existingConfigSecret: neon-vm-compute-config
  image: '' # Fork digest from profiles/lab/neon-compute.json; never implicit old upstream.
  rootDiskSize: 8Gi
  cpu:
    min: 1
    use: 1
    max: 2
  memory:
    slotSize: 1Gi
    minSlots: 1
    useSlots: 1
    maxSlots: 3
    minBound: 1Gi
    maxBound: 3Gi

  runtime:
    # 来自原部署计划；Helm不生成UID、incarnation、签名材料或平台资格。
    executionModel: ''
    projectId: '' # 原真实创建计划，不由Helm生成项目/Endpoint身份。
    endpointId: ''
    incarnation: ''
    computeInstanceId: ''
    runnerImage: ''
    # trusted-runtime-v1必须显式填写limits.cpu/memory；默认空不绑定旧实例预算。
    # 本轮实际部署值：limits {cpu: "4", memory: "10Gi"}，requests由部署预算固定。
    podResources: {}
    kernelImage: ''
    serviceAccountName: ''
    configMountPath: ''
    configFile: ''
    postgresPort: 55432

# 本轮 PG17 专用节点池；部署前必须验证标签只属于这三个节点。
placement:
  allowedNodeNames:
  - worker-117
  - worker-118
  - worker-119

# 默认保留旧额外网络；本轮PG17显式false并整个省略extraNetwork，避免未启用时finalizer误触IPAM。
network:
  secondary:
    enabled: true
