# 可由Mac本地Worker或同一集群发行复用；无令牌内容/业务凭据。
workloadNamespace: neon
agentNamespace: kube-system
agentDaemonSet: autoscaler-agent
apiServiceAccount: neon-control-api
workerServiceAccount: neon-control-worker
qualifierServiceAccount: qualification-issuer
nodeReadClusterRole: neon-control-runtime-worker-nodes
# 用户授权的站点配置规范化：观察到的节点与派生 Host Lease 集合必须显式提供。
allowedNodes: []
hostLeaseNamespace: neon
hostLeaseNames: []
