{{- if .Values.storageBroker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: storage-broker }
spec:
  replicas: {{ .Values.storageBroker.replicas }}
  selector:
    matchLabels: { app: storage-broker }
  template:
    metadata:
      labels: { app: storage-broker }
    spec:
      {{- with .Values.global.platformPriorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
      - name: storage-broker
        resources:
          {{- toYaml .Values.storageBroker.resources | nindent 10 }}
        image: "{{ include "neon-lab.component-image" (list . "storageBroker") }}"
        imagePullPolicy: {{ .Values.global.neonImage.pullPolicy }}
        command: ["storage_broker","--listen-addr=0.0.0.0:50051"]
        ports: [{ name: grpc, containerPort: 50051 }]
---
apiVersion: v1
kind: Service
metadata: { name: storage-broker }
spec:
  selector: { app: storage-broker }
  ports: [{ name: grpc, port: 50051, targetPort: grpc }]

{{- end }}
