{{- if .Values.storageController.enabled }}
{{- $mgmt := .Values.storageController.management -}}
{{- if and $mgmt.enabled (or (eq (int $mgmt.port) 1234) (eq $mgmt.serviceName "storage-controller")) -}}{{ fail "management requires its own Service and HTTPS port" }}{{- end -}}
{{- if and $mgmt.enabled (not $mgmt.authenticationEnabled) (not .Values.storageController.devMode) -}}{{ fail "TLS-only transition must be explicitly devMode; final mode requires authentication" }}{{- end -}}
{{- if and $mgmt.enabled $mgmt.authenticationEnabled .Values.storageController.devMode -}}{{ fail "authenticated management requires storageController.devMode=false" }}{{- end -}}
{{- if and $mgmt.enabled $mgmt.authenticationEnabled (or (empty $mgmt.authSecret) (empty .Values.storageController.hookTokenSecret)) -}}{{ fail "native management requires original auth and hook Secret references" }}{{- end -}}
{{- if and $mgmt.enabled .Values.storageController.managePageserver (empty $mgmt.pageserverUpcallSecret) -}}{{ fail "managed Pageserver requires its original generations_api Secret" }}{{- end -}}
{{- $roleSelector := .Values.storageController.nodeSelector | default dict -}}
{{- if not (kindIs "map" $roleSelector) -}}{{ fail "storageController.nodeSelector must be a hostname map" }}{{- end -}}
{{- range $key, $value := $roleSelector -}}
{{- if or (ne $key "kubernetes.io/hostname") (not (has $value (list "worker-117" "worker-118" "worker-119"))) -}}
{{- fail "storageController.nodeSelector permits only hostname worker-117/118/119; pool/os/arch cannot be overridden" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: controller-db-data
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageController.persistence.storageClassName }}
  storageClassName: {{ .Values.storageController.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.storageController.persistence.size }} }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: controller-db }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: controller-db }
  template:
    metadata:
      labels: { app: controller-db }
    spec:
      {{- include "neon-core.placement.pod" $ | nindent 6 }}
      {{- with .Values.global.platformPriorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
      - name: postgres
        resources:
          {{- toYaml .Values.storageController.dbResources | nindent 10 }}
        image: {{ .Values.storageController.dbImage | quote }}
        env:
        - { name: POSTGRES_USER, value: neon_controller }
        - { name: POSTGRES_DB, value: storage_controller }
        - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: {{ .Values.storageController.existingSecret }}, key: password } }
        ports: [{ name: pg, containerPort: 5432 }]
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "neon_controller", "-d", "storage_controller"] }
          initialDelaySeconds: 5
        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
      - { name: data, persistentVolumeClaim: { claimName: controller-db-data } }
---
apiVersion: v1
kind: Service
metadata: { name: controller-db }
spec:
  selector: { app: controller-db }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storage-controller }
spec:
  replicas: 1
  selector:
    matchLabels: { app: storage-controller }
  template:
    metadata:
      labels: { app: storage-controller }
    spec:
      {{- include "neon-core.placement.selector" $ | nindent 6 }}
      {{- with .Values.storageController.nodeSelector }}
        kubernetes.io/hostname: {{ index . "kubernetes.io/hostname" | quote }}
      {{- end }}
      affinity:
        {{- include "neon-core.placement.nodeAffinity" $ | nindent 8 }}
      {{- with .Values.global.platformPriorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
      - name: controller
        resources:
          {{- toYaml .Values.storageController.resources | nindent 10 }}
        image: {{ include "neon-lab.component-image" (list . "storageController") | quote }}
        command: ["/usr/local/bin/storage_controller"]
        args:
        - --listen=0.0.0.0:1234
        {{- if $mgmt.enabled }}
        - --listen-https=0.0.0.0:{{ $mgmt.port }}
        - --ssl-key-file=/run/neon/storage-tls/tls.key
        - --ssl-cert-file=/run/neon/storage-tls/tls.crt
        {{- end }}
        {{- if .Values.storageController.hookUrl }}
        - --control-plane-url={{ .Values.storageController.hookUrl }}
        {{- end }}
        {{- if .Values.storageController.hookTokenSecret }}
        - --control-plane-jwt-token=$(CONTROLLER_HOOK_TOKEN)
        {{- end }}
        {{- if .Values.storageController.devMode }}
        - --dev
        {{- end }}
        env:
        - name: DATABASE_URL
          valueFrom: { secretKeyRef: { name: {{ .Values.storageController.existingSecret }}, key: url } }
        {{- if .Values.storageController.hookTokenSecret }}
        - name: CONTROLLER_HOOK_TOKEN
          valueFrom: { secretKeyRef: { name: {{ .Values.storageController.hookTokenSecret }}, key: token } }
        {{- end }}
        {{- if and $mgmt.enabled $mgmt.authenticationEnabled }}
        - name: PUBLIC_KEY
          valueFrom: { secretKeyRef: { name: {{ $mgmt.authSecret }}, key: public_key } }
        - name: PAGESERVER_JWT_TOKEN
          valueFrom: { secretKeyRef: { name: {{ $mgmt.authSecret }}, key: pageserver_token } }
        - name: SAFEKEEPER_JWT_TOKEN
          valueFrom: { secretKeyRef: { name: {{ $mgmt.authSecret }}, key: safekeeper_token } }
        - name: PEER_JWT_TOKEN
          valueFrom: { secretKeyRef: { name: {{ $mgmt.authSecret }}, key: peer_token } }
        {{- end }}
        ports:
        - { name: http, containerPort: 1234 }
        {{- if $mgmt.enabled }}
        - { name: https, containerPort: {{ $mgmt.port }} }
        volumeMounts:
        - { name: management-tls, mountPath: /run/neon/storage-tls, readOnly: true }
        {{- end }}
        readinessProbe:
          tcpSocket: { port: http }
          initialDelaySeconds: 5
      {{- if $mgmt.enabled }}
      volumes:
      - name: management-tls
        secret: { secretName: {{ $mgmt.tlsSecret }}, defaultMode: 292 }
      {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: storage-controller }
spec:
  selector: { app: storage-controller }
  ports: [{ name: http, port: 1234, targetPort: http }]
{{- if $mgmt.enabled }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ $mgmt.serviceName }} }
spec:
  type: ClusterIP
  selector: { app: storage-controller }
  ports: [{ name: https, port: {{ $mgmt.port }}, targetPort: https }]
{{- if $mgmt.issuerName }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: {{ $mgmt.tlsSecret }} }
spec:
  secretName: {{ $mgmt.tlsSecret }}
  issuerRef: { name: {{ $mgmt.issuerName }}, kind: Issuer }
  dnsNames:
  - {{ printf "%s.%s.svc" $mgmt.serviceName .Release.Namespace | quote }}
  - {{ printf "%s.%s.svc.cluster.local" $mgmt.serviceName .Release.Namespace | quote }}
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
{{- end }}
{{- end }}
{{- end }}
