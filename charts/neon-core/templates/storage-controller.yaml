{{- if .Values.storageController.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: controller-db-data
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storageController.persistence.storageClassName }}
  storageClassName: {{ .Values.storageController.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests: { storage: {{ .Values.storageController.persistence.size }} }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: controller-db }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: controller-db }
  template:
    metadata:
      labels: { app: controller-db }
    spec:
      {{- with .Values.global.platformPriorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
      - name: postgres
        resources:
          {{- toYaml .Values.storageController.dbResources | nindent 10 }}
        image: {{ .Values.storageController.dbImage | quote }}
        env:
        - { name: POSTGRES_USER, value: neon_controller }
        - { name: POSTGRES_DB, value: storage_controller }
        - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: {{ .Values.storageController.existingSecret }}, key: password } }
        ports: [{ name: pg, containerPort: 5432 }]
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "neon_controller", "-d", "storage_controller"] }
          initialDelaySeconds: 5
        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
      - { name: data, persistentVolumeClaim: { claimName: controller-db-data } }
---
apiVersion: v1
kind: Service
metadata: { name: controller-db }
spec:
  selector: { app: controller-db }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storage-controller }
spec:
  replicas: 1
  selector:
    matchLabels: { app: storage-controller }
  template:
    metadata:
      labels: { app: storage-controller }
    spec:
      {{- with .Values.global.platformPriorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
      - name: controller
        resources:
          {{- toYaml .Values.storageController.resources | nindent 10 }}
        image: {{ include "neon-lab.component-image" (list . "storageController") | quote }}
        command: ["/usr/local/bin/storage_controller"]
        args:
        - --listen=0.0.0.0:1234
        {{- if .Values.storageController.hookUrl }}
        - --control-plane-url={{ .Values.storageController.hookUrl }}
        {{- end }}
        {{- if .Values.storageController.hookTokenSecret }}
        - --control-plane-jwt-token=$(CONTROLLER_HOOK_TOKEN)
        {{- end }}
        {{- if .Values.storageController.devMode }}
        - --dev
        {{- end }}
        env:
        - name: DATABASE_URL
          valueFrom: { secretKeyRef: { name: {{ .Values.storageController.existingSecret }}, key: url } }
        {{- if .Values.storageController.hookTokenSecret }}
        - name: CONTROLLER_HOOK_TOKEN
          valueFrom: { secretKeyRef: { name: {{ .Values.storageController.hookTokenSecret }}, key: token } }
        {{- end }}
        ports: [{ name: http, containerPort: 1234 }]
        readinessProbe:
          tcpSocket: { port: http }
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: storage-controller }
spec:
  selector: { app: storage-controller }
  ports: [{ name: http, port: 1234, targetPort: http }]
{{- end }}
