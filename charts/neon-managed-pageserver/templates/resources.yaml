{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" .Values.image) -}}{{- fail "image must be pinned by digest" -}}{{- end -}}
{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" .Values.initImage) -}}{{- fail "initImage must be pinned by digest" -}}{{- end -}}
{{- if and .Values.config.upcallSecret (not (hasPrefix "https://" .Values.config.controllerEndpoint)) -}}{{ fail "authenticated upcall requires HTTPS" }}{{- end -}}
{{- if and (hasPrefix "https://" .Values.config.controllerEndpoint) (empty .Values.config.upcallSecret) -}}{{ fail "HTTPS upcall requires its CA and token Secret" }}{{- end -}}
{{- if and .Values.config.upcallSecret (not .Values.config.create) -}}{{ fail "authenticated upcall requires chart-managed configuration" }}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pageserver-managed
  labels: {app: pageserver-managed, app.kubernetes.io/part-of: neon-control}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: pageserver-managed}
  template:
    metadata:
      labels: {app: pageserver-managed, app.kubernetes.io/part-of: neon-control}
    spec:
      {{- include "neon-managed-pageserver.placement.pod" $ | nindent 6 }}
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      initContainers:
      - name: init-config
        image: {{ .Values.initImage | quote }}
        command: ["sh", "-ec"]
        args:
        - |
          mkdir -p /data/.neon
          cp /config/* /data/.neon/
          {{- if .Values.config.upcallSecret }}
          chmod 600 /data/.neon/pageserver.toml
          upcall_token="$(cat /run/neon/storage-upcall/token)"
          case "$upcall_token" in ''|*[!A-Za-z0-9_.-]*) exit 1;; esac
          printf "\ncontrol_plane_api_token='%s'\n" "$upcall_token" >> /data/.neon/pageserver.toml
          unset upcall_token
          {{- end }}
          chown -R 1000:1000 /data/.neon || true
        resources:
{{ toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: config, mountPath: /config, readOnly: true}
        {{- if .Values.config.upcallSecret }}
        - {name: storage-upcall, mountPath: /run/neon/storage-upcall, readOnly: true}
        {{- end }}
      containers:
      - name: pageserver
        image: {{ .Values.image | quote }}
        command: ["/usr/local/bin/pageserver", "-D", "/data/.neon"]
        ports:
        - {name: pg, containerPort: 6400}
        - {name: http, containerPort: 9898}
        env:
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: {{ .Values.objectStoreSecret }}, key: accessKey}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.objectStoreSecret }}, key: secretKey}}}
        readinessProbe:
          tcpSocket: {port: 6400}
          initialDelaySeconds: 3
        resources:
{{ toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - {name: data, mountPath: /data}
        {{- if .Values.config.upcallSecret }}
        - {name: storage-upcall, mountPath: /run/neon/storage-upcall/ca.crt, subPath: ca.crt, readOnly: true}
        {{- end }}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: {{ .Values.existingClaim }}}}
      - {name: config, configMap: {name: {{ .Values.configMap }}}}
      {{- if .Values.config.upcallSecret }}
      - name: storage-upcall
        secret:
          secretName: {{ .Values.config.upcallSecret }}
          items:
          - {key: token, path: token, mode: 256}
          - {key: ca.crt, path: ca.crt, mode: 292}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: pageserver-managed
  labels: {app: pageserver-managed, app.kubernetes.io/part-of: neon-control}
spec:
  type: ClusterIP
  selector: {app: pageserver-managed}
  ports:
  - {name: pg, port: 6400, targetPort: pg}
  - {name: http, port: 9898, targetPort: http}
