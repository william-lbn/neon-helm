{{- if .Values.enabled }}
{{- if not .Values.developmentAcknowledged }}{{ fail "neon-metadata requires developmentAcknowledged; production must use external HA PostgreSQL" }}{{ end }}
{{- if not (regexMatch "^[^[:space:]]+@sha256:[a-f0-9]{64}$" .Values.image) }}{{ fail "metadata image must be digest pinned" }}{{ end }}
{{- $name := .Values.fullnameOverride }}
{{- if and .Values.persistence.create .Values.persistence.existingClaim }}{{ fail "choose create or existingClaim, not both" }}{{ end }}
{{- if and (not .Values.persistence.create) (not .Values.persistence.existingClaim) }}{{ fail "external PVC requires existingClaim" }}{{ end }}
{{- if .Values.persistence.create }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  annotations: {helm.sh/resource-policy: keep}
  labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/managed-by: Helm, app.kubernetes.io/part-of: neon}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.persistence.size | quote }}}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/managed-by: Helm, app.kubernetes.io/part-of: neon}
spec:
  replicas: 1
  # A second writer must never mount the retained RWO data directory.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/part-of: neon}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.username | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: password}}
          ports: [{name: postgres, containerPort: 5432}]
          startupProbe:
            exec: {command: [pg_isready, -U, {{ .Values.username | quote }}, -d, {{ .Values.database | quote }}]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, {{ .Values.username | quote }}, -d, {{ .Values.database | quote }}]}
            periodSeconds: 5
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default $name .Values.persistence.existingClaim }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/managed-by: Helm}
spec:
  type: {{ .Values.service.type }}
  selector: {app.kubernetes.io/name: {{ $name }}}
  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
{{- end }}
