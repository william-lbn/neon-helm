{{- if and (contains "cache.no-flush=on" .Values.controller.qemuDiskCacheSettings) (not .Values.controller.labAcknowledged) -}}{{- fail "cache.no-flush=on requires an explicit lab acknowledgement; unsafe for durability claims" -}}{{- end -}}
