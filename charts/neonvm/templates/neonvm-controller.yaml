  kind: ClusterRole
  name: neonvm-manager-role
subjects:
- kind: ServiceAccount
  name: neonvm-controller
  namespace: neonvm-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: neonvm
    app.kubernetes.io/instance: controller
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: deployment
    app.kubernetes.io/part-of: neonvm
    control-plane: controller
  name: neonvm-controller
  namespace: neonvm-system
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      {{- toYaml .Values.controller.rollingUpdate | nindent 6 }}
  selector:
    matchLabels:
      control-plane: controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller
    spec:
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      affinity:
        {{- if .Values.controller.spreadAcrossNodes }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                control-plane: controller
            topologyKey: kubernetes.io/hostname
        {{- end }}
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
                - ppc64le
                - s390x
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        - --leader-elect
        - --leader-election-lease-duration=60s
        - --leader-election-renew-deadline=45s
        - --leader-election-retry-period=2s
        - --k8s-client-qps={{ .Values.controller.apiClient.qps }}
        - --k8s-client-burst={{ .Values.controller.apiClient.burst }}
        - --concurrency-limit={{ .Values.controller.apiClient.concurrency }}
        - --skip-update-validation-for=
        - --disable-runner-cgroup
        - --default-cpu-scaling-mode=QmpScaling
        - --use-virtio-console=true
        - --qemu-disk-cache-settings={{ .Values.controller.qemuDiskCacheSettings }}
        - --memhp-auto-movable-ratio=401
        - --failure-pending-period=1m
        - --failing-refresh-interval=15s
        command:
        - /manager
        env:
        - name: VM_RUNNER_IMAGE
          value: {{ .Values.images.runner | quote }}
        - name: NAD_IPAM_NAME
          value: neonvm-overlay-ipam
        - name: NAD_IPAM_NAMESPACE
          value: neonvm-system
        - name: NAD_RUNNER_NAME
          value: neonvm-overlay-for-vms
        - name: NAD_RUNNER_NAMESPACE
          value: neonvm-system
        image: {{ .Values.images.controller | quote }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: neonvm-controller
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
