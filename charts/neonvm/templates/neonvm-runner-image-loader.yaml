apiVersion: v1
kind: Namespace
metadata:
  name: neonvm-system
  annotations: {helm.sh/resource-policy: keep}

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: neonvm-runner-image-loader
  namespace: neonvm-system
spec:
  selector:
    matchLabels:
      name: neonvm-runner-image-loader
  template:
    metadata:
      labels:
        name: neonvm-runner-image-loader
    spec:
      containers:
      - command:
        - sh
        - -c
        - echo 'image loaded and container started' && sleep 100d
        image: {{ .Values.images.runner | quote }}
        name: neonvm-runner-loader
        resources:
          limits:
            cpu: 10m
            memory: 10Mi
      terminationGracePeriodSeconds: 0
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 100%
    type: RollingUpdate
