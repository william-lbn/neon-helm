apiVersion: v1
kind: ServiceAccount
metadata:
  name: neonvm-vxlan-controller
  namespace: neonvm-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: neonvm-vxlan-controller
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: neonvm-vxlan-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: neonvm-vxlan-controller
subjects:
- kind: ServiceAccount
  name: neonvm-vxlan-controller
  namespace: neonvm-system

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: vxlan-controller
    app.kubernetes.io/created-by: neonvm
    app.kubernetes.io/instance: vxlan-controller
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: daemonset
    app.kubernetes.io/part-of: neonvm
    control-plane: vxlan-controller
  name: neonvm-vxlan-controller
  namespace: neonvm-system
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: vxlan-controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: vxlan-controller
      labels:
        app.kubernetes.io/component: vxlan-controller
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - env:
        - name: MY_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        image: {{ .Values.images.vxlanController | quote }}
        imagePullPolicy: IfNotPresent
        name: vxlan-controller
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 50Mi
        securityContext:
          capabilities:
            add:
            - NET_RAW
            - NET_ADMIN
          privileged: false
        volumeMounts:
        - mountPath: /host/opt/cni/bin
          name: cni-bin-dir
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      initContainers:
      - command:
        - /bin/sh
        - -c
        - cp -rf /opt/cni/bin /host/opt/cni
        image: {{ .Values.images.vxlanController | quote }}
        imagePullPolicy: IfNotPresent
        name: install-cni
        volumeMounts:
        - mountPath: /host/opt/cni/bin
          name: cni-bin-dir
      securityContext: {}
      serviceAccount: vxlan-controller
      serviceAccountName: neonvm-vxlan-controller
      terminationGracePeriodSeconds: 10
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /opt/cni/bin
        name: cni-bin-dir
