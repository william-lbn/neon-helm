experimentalAcknowledged: false
compatibility:
  expectedKubernetesMinor: "31"
  allowUntestedKubernetes: false
controller:
  # Existing labs explicitly preserve their original unsafe disk cache setting.
  # New installs retain flushes; neither option is a durability/DR certification.
  qemuDiskCacheSettings: cache.writeback=on,cache.direct=on,cache.no-flush=off
  labAcknowledged: false
  replicas: 3
  # Optional platform reservation profile. No image/CRD/source change.
  spreadAcrossNodes: false
  priorityClassName: ""
  apiClient:
    qps: 1000
    burst: 2000
    concurrency: 128
  resources:
    requests: {cpu: 2, memory: 1Gi}
    limits: {cpu: 8, memory: 2Gi}
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
network:
  # Operators must verify disjoint actual Pod/Service/host CIDRs before install.
  podRange: 10.100.0.0/16
  podRangeStart: 10.100.1.0
  podRangeEnd: 10.100.127.255
  vmRange: 10.100.0.0/16
  vmRangeStart: 10.100.128.0
platformPriority:
  create: false
  name: neon-platform-critical
  value: 100000
images:
  # Supply the fork digests from profiles/lab/neonvm.json. An acknowledgement
  # alone must never silently fall back to historical upstream runtime images.
  controller: ''
  runner: ''
  vxlanController: ''
